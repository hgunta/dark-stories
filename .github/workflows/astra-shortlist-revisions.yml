name: Rewrite three shortlisted Astra mysteries — capped

on:
  push:
    branches: [editorial/story-quality-gate]
    paths:
      - .github/workflows/astra-shortlist-revisions.yml

permissions:
  contents: read
  actions: read

jobs:
  revise:
    if: github.event.head_commit.message == 'editorial-batch:REVISE-THREE-ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENAI_API_KEY: ${{ secrets.DARK_STORIES_EVAL_OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Python SDK
        run: python -m pip install --disable-pip-version-check "openai>=1.0.0"
      - name: Retrieve unapproved top-five report from previous run
        run: |
          mkdir -p .story-evals
          gh run download 43121847779 -R hgunta/dark-stories \
            --name five-astra-retry-stories --dir .story-evals
          test -s .story-evals/astra-five-retry.json
      - name: Refine strongest three using Astra and Sol with remaining budget
        run: |
          python tools/refine_astra_shortlist.py --execute \
            --source .story-evals/astra-five-retry.json \
            --output .story-evals/refined-three.json \
            --prior-spend-estimate 2.26 --max-cost-usd 2.70 \
            --total-budget-usd 5
      - name: Print unapproved revised concepts and criticism for owner review
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".story-evals/refined-three.json")
          if not p.exists():
              print("NO_REFINED_RESULTS")
              raise SystemExit(0)
          j=json.loads(p.read_text())
          for family, val in j.get("revisions", {}).items():
              if val.get("text"):
                  print("REVISED_STORY_JSON "+json.dumps({"family":family,**val},ensure_ascii=False))
          for family, val in j.get("reviews", {}).items():
              if val.get("text"):
                  print("REVISED_REVIEW_JSON "+json.dumps({"family":family,**val},ensure_ascii=False))
          print("REVISED_RANKED_JSON "+json.dumps(j.get("ranked",[]),ensure_ascii=False))
          PY
      - name: Keep a one-day editorial checkpoint even if partly incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refined-three-astra-stories
          path: .story-evals/refined-three.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn
