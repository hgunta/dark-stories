name: Full Conversation Storage (Disposable Postgres)

on:
  push:
    branches: [feature/neon-optin-full-conversations]
    paths: [.github/workflows/full-conversation-db-smoke.yml]

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: conversation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Test complete dialogue, privacy, deletion against real PostgreSQL
        env:
          TEST_PLAYTEST_DB_DSN: postgresql://postgres:postgres@localhost:5432/conversation_test
        run: python tools/verify_playtest_postgres.py
