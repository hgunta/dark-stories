name: Live Case 003 release check
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/live-desert-release-check.mjs'
      - '.github/workflows/live-desert-release-check.yml'
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare actual Render preview catalog and room to PR 44
        run: node tools/live-desert-release-check.mjs
