name: Production versus preview release diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/live-prod-v-preview-check.mjs'
      - '.github/workflows/live-prod-v-preview-check.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare public HTML and catalog on production and preview
        run: node tools/live-prod-v-preview-check.mjs
