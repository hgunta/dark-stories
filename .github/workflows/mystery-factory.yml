name: Mystery Factory (opt-in)

# Weekly check, but paid work is DISABLED until the owner explicitly enables
# the repository variable ENABLE_MYSTERY_FACTORY=true and configures a secret.
on:
  schedule:
    - cron: "0 15 * * 0" # Sundays 15:00 UTC
  workflow_dispatch:
    inputs:
      execute:
        description: "Run paid writer and verifier? Requires explicit repo enable switch."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mystery-factory
  cancel-in-progress: false

jobs:
  preview:
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.execute != true }"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python tools/mystery_factory.py --dry-run

  generate:
    if: "${{ vars.ENABLE_MYSTERY_FACTORY == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.execute == true)) }"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
    env:
      OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }"
      GH_TOKEN: "${{ github.token }"
      RUN_ID: "factory-${{ github.run_id }"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install writer dependency
        run: python -m pip install --no-cache-dir 'openai>=1,<3'
      - name: Require owner configured secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing OpenAI API secret; no AI call made."
            exit 1
          fi
      - name: Write and evaluate one candidate
        run: python tools/mystery_factory.py --api --run-id "$RUN_ID"
      - name: Open draft review PR — never add drafts to playable game directory
        run: |
          set -eu
          branch="factory/$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "candidates/$RUN_ID.json" "candidates/$RUN_ID.report.json"
          git commit -m "content: draft and adversarially test mystery"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Mystery Factory candidate $RUN_ID — human review required" \
            --body "AI-generated draft and independent verification report live in candidates/. NOT approved to publish. Manually test moderator behavior and use the Review Desk before explicitly copying a vetted case into backend/mysteries/. This draft PR must not be treated as a game publication. Maximum 12 AI calls."
