name: Verify PR48 live homepage
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pr48-live-homepage-check.mjs'
      - '.github/workflows/pr48-live-homepage-check.yml'
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm public beta paragraph removed from production
        run: node tools/pr48-live-homepage-check.mjs
