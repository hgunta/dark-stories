name: Preview discovery completion regression

on:
  push:
    branches: [feature/pixel-case-stamp-frontend]
    paths:
      - 'backend/app.py'
      - 'backend/mysteries/**'
      - 'frontend/index.html'
      - 'tests/test_discovery_completion.py'
      - 'tests/test_star_feedback.py'
      - 'backend/feedback.py'
      - 'backend/playtest_store.py'
      - 'tests/test_chat_first_solves.py'
      - 'tests/test_almost_solved.py'
      - 'tests/test_moderator_fairness.py'
      - 'tests/test_moderation.py'
      - 'tests/test_mystery_library_quality.py'
      - '.github/workflows/preview-discovery-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      USE_API: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify multi-turn auto-solving and fairness
        run: |
          env -u OPENAI_API_KEY python -m pytest -q -p no:cacheprovider \
            tests/test_discovery_completion.py \
            tests/test_star_feedback.py \
            tests/test_chat_first_solves.py \
            tests/test_almost_solved.py \
            tests/test_moderator_fairness.py \
            tests/test_moderation.py \
            tests/test_mystery_library_quality.py \
            tests/test_desert_matchstick.py
