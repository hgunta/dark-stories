name: Preview solving regression

on:
  pull_request:
    branches: [feature/pixel-case-stamp-frontend]
    paths:
      - 'backend/app.py'
      - 'backend/game.py'
      - 'tests/test_chat_first_solves.py'
      - 'tests/test_desert_matchstick.py'
      - 'backend/mysteries/ms-003.json'
      - '.github/workflows/preview-solving-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solving:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      USE_API: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --no-cache-dir -r requirements-test.txt
      - name: Verify Python code compiles
        run: python -m compileall -q backend
      - name: Test chat-first solving routes
        run: env -u OPENAI_API_KEY python -m pytest -q tests/test_chat_first_solves.py tests/test_desert_matchstick.py tests/test_homepage_experience.py -p no:cacheprovider
