name: One-time Production Public Beta Smoke

on:
  push:
    branches: [release/public-beta-playtest]
    paths: [.github/workflows/public-beta-production-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python tools/verify_live_public_beta.py
