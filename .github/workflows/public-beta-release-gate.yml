name: Public Beta Release Gate

on:
  push:
    branches: [release/public-beta-playtest]
    paths: [.github/workflows/public-beta-release-gate.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_API: "false"
      DARK_STORIES_BETA_COLLECT_ALL: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir -r requirements-test.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: python tools/check_beta_frontend.py
# Full build rerun after final beta compatibility updates.
