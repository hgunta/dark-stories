name: Private Reviewer Full Build

on:
  push:
    branches: [feature/private-playtest-review]
    paths: [.github/workflows/review-full-build-staging.yml]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      USE_API: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir -r requirements-test.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
