name: One-time Private Review Live Access Gate

on:
  push:
    branches: [feature/private-playtest-review]
    paths: [.github/workflows/review-live-auth-smoke.yml]

permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify reviewer data cannot be read anonymously
        run: |
          python - <<'PY'
          import time,urllib.request,urllib.error
          root="https://dark-stories-preview.onrender.com"
          endpoints=["/review/","/review/app.js","/review/style.css",
                     "/api/review/overview","/api/review/export.jsonl"]
          def status(path):
              try:
                  with urllib.request.urlopen(root+path,timeout=35) as r:return r.status
              except urllib.error.HTTPError as e:return e.code
          for i in range(55):
              result=[status(p) for p in endpoints]
              if result==[401]*len(endpoints):break
              time.sleep(4)
          else:raise AssertionError("Private review routes not safely authenticated: "+str(result))
          assert status("/api/playtest/status")==200
          assert status("/api/mysteries")==200
          print("Live reviewer pages and API: all 401 without credentials")
          print("Live public game endpoints: 200")
          PY
