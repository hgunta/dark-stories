name: Private Review Postgres Integration

on:
  push:
    branches: [feature/private-playtest-review]
    paths: [.github/workflows/review-postgres-staging.yml]

permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: review_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Verify private review against disposable PostgreSQL
        env:
          TEST_PLAYTEST_DB_DSN: postgresql://postgres:postgres@localhost:5432/review_test
        run: python tools/verify_private_review_postgres.py
