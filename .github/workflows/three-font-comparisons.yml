name: Three real font comparisons
on:
  push:
    branches: [feature/pixel-case-stamp-frontend]
    paths:
      - 'frontend/index.html'
      - 'frontend/case-stamp.css'
      - 'tools/font-variant-preview.mjs'
      - '.github/workflows/three-font-comparisons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      USE_API: "false"
      DARK_STORIES_BETA_COLLECT_ALL: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and screenshot browser
        run: |
          python -m pip install -r requirements-test.txt
          mkdir -p /tmp/ds-playwright
          cd /tmp/ds-playwright
          npm init -y >/dev/null
          npm install playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start isolated test app
        run: |
          (cd backend && USE_API=false DARK_STORIES_BETA_COLLECT_ALL=true python -m uvicorn app:app --host 127.0.0.1 --port 8765 > /tmp/ds-font-preview.log 2>&1 &)
          for i in {1..35}; do
            if curl -fsS http://127.0.0.1:8765/api/mysteries >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ds-font-preview.log
          exit 1
      - name: Screenshot actual homepage and chat at desktop and mobile sizes
        run: node tools/font-variant-preview.mjs
      - name: Upload the twelve font comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelify-jersey15-jersey10-actual-screens
          path: artifacts/font-comparisons/*
          if-no-files-found: ignore
          retention-days: 14
